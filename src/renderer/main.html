<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Rotina Desktop</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 40" aria-hidden="true">
        <path d="M2 37 L21 12 L29 22 L39 7 L62 37" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M17 18 L21 12 L24 16 M35 13 L39 7 L43 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
      </svg>
      <div>
        <h1>MINHA ROTINA</h1>
        <p>FOCO NO TRABALHO, PRESENÇA EM CASA E DESCANSO</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="hoje" class="active"><span data-icon="clock"></span>Hoje</button>
      <button data-view="semana"><span data-icon="calendar"></span>Semana</button>
      <button data-view="regras"><span data-icon="star"></span>Regras e casa</button>
      <button data-view="config"><span data-icon="settings"></span>Configurações</button>
    </nav>
    <div class="top-right">
      <div class="motto">Disciplina hoje,<br>liberdade amanhã!</div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-pause" title="Pausar rotina"></button>
        <button class="icon-btn" id="btn-mute" title="Silenciar 30 min"></button>
        <button class="icon-btn" id="btn-floating" title="Janela flutuante"></button>
      </div>
    </div>
  </header>

  <div id="state-strip" class="state-strip hidden"></div>
  <div id="banner" class="banner hidden"></div>

  <main>
    <!-- HOJE -->
    <section id="view-hoje" class="view active">
      <div class="today-grid">
        <aside class="now-col">
          <div class="card clock-card">
            <div class="clock"><span id="clock-hm">--:--</span><span id="clock-s" class="sec">--</span></div>
            <div class="clock-date"><strong id="clock-weekday"></strong><span id="clock-date"></span></div>
            <div id="day-note" class="day-note hidden"></div>
          </div>
          <div id="now-card" class="card now-card"></div>
          <div id="next-card" class="card next-card"></div>
          <div class="card quick">
            <button class="btn" id="q-snooze"><span data-icon="clock"></span>Adiar alerta</button>
            <button class="btn" id="q-mute"><span data-icon="volumeX"></span>Silenciar 30 min</button>
            <button class="btn" id="q-pause"><span data-icon="pause"></span>Pausar</button>
          </div>
          <div class="card meta-card">
            <span class="meta-icon" data-icon="target" data-size="34"></span>
            <div class="meta-text"><strong>META:</strong> <span id="meta-text"></span></div>
            <div class="meta-progress"><div class="meta-bar"><i id="meta-bar"></i></div><small id="meta-count"></small></div>
          </div>
        </aside>

        <section class="card timeline-card">
          <div class="band">
            <span data-icon="calendar" data-size="22"></span>
            <h2>MINHA ROTINA DIÁRIA</h2>
            <div class="day-picker" id="day-picker"></div>
          </div>
          <div class="timeline-head" id="timeline-head"></div>
          <ol class="timeline" id="timeline"></ol>
        </section>
      </div>
    </section>

    <!-- SEMANA -->
    <section id="view-semana" class="view">
      <div class="week-layout">
        <section class="card">
          <div class="band">
            <span data-icon="calendar" data-size="22"></span>
            <h2>CADA DIA DA SEMANA</h2>
            <div class="week-nav" id="week-nav"></div>
          </div>
          <div class="week-days" id="week-days"></div>
        </section>
        <section class="card">
          <div class="band">
            <span data-icon="list" data-size="22"></span>
            <h2>SEMANA EM BLOCOS</h2>
          </div>
          <div class="week-grid-wrap"><div class="week-grid" id="week-grid"></div></div>
        </section>
      </div>
    </section>

    <!-- REGRAS -->
    <section id="view-regras" class="view">
      <div class="rules-grid" id="rules-grid"></div>
    </section>

    <!-- CONFIGURAÇÕES -->
    <section id="view-config" class="view">
      <div class="config-layout">
        <nav class="config-nav" id="config-nav">
          <button data-panel="atividades" class="active"><span data-icon="list"></span>Atividades</button>
          <button data-panel="categorias"><span data-icon="star"></span>Categorias e cores</button>
          <button data-panel="alertas"><span data-icon="bell"></span>Alertas e sons</button>
          <button data-panel="semana"><span data-icon="home"></span>Tarefas da semana</button>
          <button data-panel="excecoes"><span data-icon="calendar"></span>Exceções de datas</button>
          <button data-panel="listas"><span data-icon="check"></span>Regras e listas</button>
          <button data-panel="agentes"><span data-icon="zap"></span>Agentes de IA</button>
          <button data-panel="geral"><span data-icon="settings"></span>Geral e backup</button>
        </nav>
        <section class="card config-panel" id="config-panel"></section>
      </div>
    </section>
  </main>

  <footer class="legend" id="legend"></footer>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="../shared/engine.js"></script>
  <script src="common.js"></script>
  <script src="main.js"></script>
  <script src="settings.js"></script>
</body>
</html>
